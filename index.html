function showWorkDbHelp(){let wrap=document.createElement('div');wrap.className='helpOverlay';wrap.innerHTML=`<div class="helpModal"><button class="btn helpClose" id="closeWorkDbHelp">닫기</button><h2>작품 DB 도움말</h2>
<p><b>작품 DB는 실제로 집필된 작품의 사실을 정리하는 곳</b>입니다. 캐릭터, 세계관·설정, 떡밥을 필요한 회차와 연결해 두면 집필 중 내용을 다시 찾기 쉽고, AI 작업실에서도 필요한 정보만 골라 전달할 수 있습니다.</p>
<p><b>스토리와 역할이 다릅니다.</b> 스토리는 앞으로 바뀔 수 있는 계획과 시뮬레이션이고, 작품 DB는 현재까지 작품 안에서 확정된 정보와 계속 지켜야 할 사실을 중심으로 관리합니다. 계획과 실제 원고가 달라졌다면 실제 원고와 회차 요약, 작품 DB를 우선합니다.</p>
<p>모든 칸을 채울 필요는 없습니다. <b style="color:#245b86">진한 청색 제목</b>은 특히 활용도가 높은 핵심 항목입니다. 확실한 사실부터 적고, 작품이 진행되면서 필요한 정보만 추가하는 편이 좋습니다. 아직 정하지 않은 내용을 억지로 채우면 오히려 이후 집필과 AI 상담에 잘못된 제약이 생길 수 있습니다.</p>
<h3>회차와 연결하는 이유</h3><p>집필의 ‘이번 화’에서 캐릭터·설정·떡밥을 연결하면 그 회차에 어떤 작품 정보가 관계되는지 기록됩니다. AI 작업실의 <b>선택 회차 관련 정보</b> 기능은 이 연결을 이용해 선택한 회차에 관계된 DB 항목을 한꺼번에 고릅니다. 따라서 모든 DB를 매번 AI에게 보내기보다, 실제로 관계된 항목만 연결해 두는 것이 장편으로 갈수록 유용합니다.</p>
<h3>캐릭터</h3><table><tr><th>항목</th><th>작성 기준</th></tr>
<tr><td>이름</td><td>인물을 구분하는 대표 이름입니다.</td></tr><tr><td>별칭·호칭</td><td>같은 인물을 가리키는 다른 표현입니다. 직함, 애칭, 성+직책, 다른 인물이 부르는 호칭 등을 적어두면 이름이 달라져도 같은 인물임을 파악하기 쉽습니다.</td></tr><tr><td>역할</td><td>작품 안에서 이 인물이 차지하는 위치를 적습니다. 직업만 적기보다 주인공, 조력자, 경쟁자, 특정 조직의 책임자처럼 서사에서 어떤 위치인지 알 수 있으면 좋습니다.</td></tr><tr><td>한줄 정의</td><td>이 인물이 누구인지 한 문장으로 압축합니다. AI 작업실에서 여러 인물을 함께 보낼 때 빠르게 구분하는 데 특히 유용합니다.</td></tr><tr><td>성격</td><td>행동과 판단에 반복적으로 영향을 주는 성향을 적습니다. ‘냉정하다’처럼 추상적인 말만 쓰기보다 어떤 상황에서 어떻게 행동하는지가 드러나면 좋습니다.</td></tr><tr><td>말투·대사 특징</td><td>존댓말 여부, 문장 길이, 어휘, 말버릇, 상대에 따른 태도처럼 실제 대사를 재현하거나 점검할 때 사용할 수 있는 특징을 적습니다.</td></tr><tr><td>목표·욕망</td><td>현재 무엇을 원하고 왜 행동하는지 적습니다. 목표가 달라졌다면 현재 유효한 내용으로 갱신합니다.</td></tr><tr><td>관계</td><td>다른 인물과의 관계와 그 관계가 행동에 미치는 영향을 적습니다. 신뢰, 경계, 의존, 원한, 숨기는 사실 등을 함께 적을 수 있습니다.</td></tr><tr><td>고정 정보</td><td>직업, 출신, 과거, 능력, 신분처럼 쉽게 바뀌지 않는 사실을 적습니다.</td></tr><tr><td>현재 상태</td><td><b>지금 시점에 유효한 최신 상태</b>를 적습니다. 부상, 소속 변화, 관계 변화, 새로 알게 된 사실처럼 현재 행동에 영향을 주는 내용이 대상입니다.</td></tr><tr><td>변화 기록</td><td>상태가 어떻게 바뀌어 왔는지를 회차와 함께 누적합니다. <b>현재 상태는 최신값, 변화 기록은 과거 이력</b>이라고 생각하면 됩니다.</td></tr><tr><td>작가 메모</td><td>미확정 아이디어나 개인 작업 메모입니다. AI 작업실에서 기본 자료로 사용하지 않습니다.</td></tr></table>
<h3>캐릭터 작성 요령</h3><p><b>AI에게 멋진 소개문을 써주는 곳이 아니라 사실을 저장하는 곳</b>이라고 생각하면 편합니다. 장황한 인물 소개보다 나중에 다시 확인해야 할 정보와 행동 규칙을 우선합니다.</p><p><b>고정 정보와 현재 상태를 분리합니다.</b> 오래 유지되는 사실은 고정 정보에, 작품 진행에 따라 달라질 수 있는 내용은 현재 상태에 둡니다.</p><p><b>현재 상태를 일기처럼 누적하지 않습니다.</b> 상태가 바뀌면 최신 내용으로 고치고 이전 내용은 변화 기록에 남깁니다.</p><p><b>말투는 재현 가능한 특징이 좋습니다.</b> ‘말을 잘한다’보다 ‘항상 존댓말, 짧게 대답함, 화가 나면 호칭을 생략함’처럼 실제 문장에서 확인할 수 있는 규칙이 유용합니다.</p>
<h3>세계관·설정</h3><p>세계관·설정은 작품에서 <b>계속 지켜야 하는 사실과 규칙</b>을 저장하는 곳입니다. 거대한 세계관 문서 하나를 통째로 넣기보다 회차에 연결하고 AI 작업실에서 필요한 것만 고를 수 있도록 적당한 단위로 나누는 편이 좋습니다.</p><table><tr><th>항목</th><th>작성 기준</th></tr>
<tr><td>설정명</td><td>검색하고 연결하기 쉬운 이름입니다. 나중에 집필에서 일부 단어만 검색해도 찾을 수 있도록 구체적으로 붙입니다.</td></tr><tr><td>분류</td><td>장소 / 조직·세력 / 능력 / 아이템 / 규칙 / 용어 / 기타 중 가장 가까운 종류를 선택합니다. 분류는 찾기 위한 묶음일 뿐 설정의 중요도를 뜻하지 않습니다.</td></tr><tr><td>한줄 정의</td><td>이 설정이 무엇인지 한 문장으로 압축합니다. 여러 설정을 AI에게 함께 보낼 때 빠르게 구분하는 데 유용합니다.</td></tr><tr><td>상세 설정</td><td>작품에서 실제로 지켜야 하는 내용과 작동 방식을 적습니다.</td></tr><tr><td>조건·제약</td><td>언제 적용되는지, 무엇이 불가능한지, 거리·횟수·대가·예외 등 한계를 적습니다. 능력이나 규칙을 AI가 임의로 확장하는 것을 막는 데 특히 중요합니다.</td></tr><tr><td>관련 설정</td><td>함께 알아야 이해되는 다른 설정이나 연결 관계를 적습니다.</td></tr><tr><td>공개 상태</td><td>작가가 아는 진실과 독자·등장인물이 현재 알고 있는 정보가 다를 때 기록합니다. 아직 공개되지 않은 사실이 대사나 서술에서 먼저 튀어나오는 것을 막는 데 도움이 됩니다.</td></tr><tr><td>작가 메모</td><td>미확정 아이디어나 수정 후보 등 개인 작업용 메모입니다. AI 작업실에서 기본 자료로 사용하지 않습니다.</td></tr></table>
<h3>설정을 나누는 기준</h3><p><b>한 항목에서 하나의 대상을 설명할 수 있으면 충분합니다.</b> 무조건 아주 잘게 쪼갤 필요는 없지만, 서로 다른 회차에서 따로 불러올 가능성이 높은 정보라면 분리하는 편이 좋습니다.</p><p><b>사실과 계획을 구분합니다.</b> ‘마법은 하루 세 번만 사용할 수 있다’처럼 현재 작품의 규칙은 작품 DB에, ‘30화에서 마법의 비밀을 밝힌다’처럼 앞으로 일어날 계획은 스토리에 두는 편이 자연스럽습니다.</p><p><b>조건과 예외를 명확히 합니다.</b> AI는 빈틈을 그럴듯하게 채우려는 경향이 있으므로 반드시 지켜야 하는 제한이 있다면 상세 설명보다 조건·제약을 분명하게 적는 것이 유용합니다.</p>
<h3>떡밥</h3><p>떡밥은 단순한 설정이 아니라 <b>독자에게 던진 질문·단서·약속을 추적하는 곳</b>입니다. 세계가 어떻게 작동하는지는 세계관·설정에, 무엇을 숨겼고 언제 드러낼지는 떡밥에 기록합니다.</p><table><tr><th>항목</th><th>작성 기준</th></tr>
<tr><td>떡밥명</td><td>작가가 빠르게 알아볼 수 있고 검색하기 쉬운 이름을 붙입니다.</td></tr><tr><td>상태</td><td>심기 전 / 심음 / 강화 중 / 회수 완료 / 폐기로 관리합니다. 실제 원고에 아직 나오지 않았다면 심기 전, 처음 노출했다면 심음, 추가 단서를 쌓는 중이면 강화 중으로 둡니다.</td></tr><tr><td>핵심 내용</td><td><b>작가가 알고 있는 실제 의미와 진실</b>을 적습니다. 독자가 현재 알고 있는 정보만 적는 칸은 아닙니다.</td></tr><tr><td>최초 등장</td><td>독자에게 처음 노출된 실제 회차를 연결합니다.</td></tr><tr><td>회수 예정</td><td>앞으로 어느 회차쯤 회수할지 계획을 숫자로 적습니다. 미정이면 비워도 됩니다.</td></tr><tr><td>회수 회차</td><td>실제로 회수한 뒤 해당 회차를 연결합니다.</td></tr><tr><td>회수 내용</td><td>정답뿐 아니라 어떤 장면·정보·행동을 통해 독자에게 밝혀졌는지 또는 밝힐지를 적습니다.</td></tr><tr><td>진행 기록</td><td>회차별로 심기·강화·변형·회수 과정을 누적합니다. 장편에서 현재까지 독자에게 무엇을 보여줬는지 추적하는 이력입니다.</td></tr><tr><td>관련 캐릭터</td><td>이 떡밥과 직접 관계된 캐릭터를 작품 DB에서 연결합니다.</td></tr><tr><td>관련 설정</td><td>이 떡밥을 이해하는 데 필요한 세계관·설정을 연결합니다.</td></tr><tr><td>작가 메모</td><td>미확정 아이디어나 개인 작업 메모입니다. AI 작업실에서 기본 자료로 사용하지 않습니다.</td></tr></table>
<h3>떡밥 관리 요령</h3><p><b>핵심 내용과 진행 기록을 구분합니다.</b> 핵심 내용은 작가가 알고 있는 정답이고, 진행 기록은 독자에게 실제로 어떤 단서를 어느 회차까지 보여줬는지에 가깝습니다.</p><p><b>모든 의문을 등록할 필요는 없습니다.</b> 나중에 다시 의미를 더하거나 반드시 회수해야 해서 잊으면 문제가 되는 것 위주로 등록하면 목록이 관리하기 쉽습니다.</p><p><b>회수 완료 후에도 남겨둡니다.</b> 완료된 떡밥도 과거 구조를 확인하거나 후속 떡밥과 연결할 때 실제 작품 기록으로 가치가 있습니다.</p>
<h3>AI 작업실에서 사용하는 법</h3><p>작품 DB 전체를 항상 AI에게 보낼 필요는 없습니다. AI 작업실에서 직접 필요한 캐릭터·설정·떡밥만 선택하거나, 회차를 고른 뒤 <b>선택 회차 관련 정보</b>를 사용해 그 회차들에 연결된 항목을 한꺼번에 선택할 수 있습니다. 선택된 자료가 많다면 필요 없는 항목을 다시 빼서 이번 작업에 필요한 정보만 전달하는 편이 좋습니다.</p><p><b>작가 메모는 기본 AI 자료에서 제외</b>합니다. 미확정 생각이나 개인 메모까지 사실처럼 전달되는 것을 피하기 위한 것입니다.</p>
<h3>기억해 둘 기준</h3><p><b>실제 원고와 회차 요약이 가장 우선되는 작품 기록</b>이고, 작품 DB는 그 사실을 찾고 재사용하기 쉽게 구조화한 자료입니다. 스토리는 앞으로 바뀔 수 있는 계획입니다. 서로 충돌한다면 이미 집필된 실제 내용을 기준으로 판단하고 작품 DB를 최신 상태에 맞게 정리하면 됩니다.</p></div>`;document.body.appendChild(wrap);$('#closeWorkDbHelp').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()}}
async function story(){
 document.body.classList.add('story-focus');
 let p=(await projects()).find(x=>x.id===currentProject);
 p.storyArcs=Array.isArray(p.storyArcs)?p.storyArcs:[];
 if(!p.overallPlot&&p.summary)p.overallPlot=p.summary;
 // v0.22: old arcs become free-form story blocks. Episode-plan fields remain in episode data but are not used here.
 let active=window.__storyBlockId||null;
 const sortBlocks=()=>p.storyArcs.sort((a,b)=>(parseInt(a.start)||999999)-(parseInt(b.start)||999999)||(parseInt(a.end)||999999)-(parseInt(b.end)||999999));
 sortBlocks();
 const autoGrow=el=>{if(!el)return;el.style.height='auto';el.style.height=Math.max(38,el.scrollHeight)+'px'};

 $('#aiHelp40').onclick=()=>showSimpleHelp40('AI 작업실 도움말',`<p><b>AI 작업실은 프로그램에 저장된 자료 중 이번 작업에 필요한 것만 골라 하나의 GPT용 텍스트로 조립하는 곳</b>입니다. 모든 자료를 항상 선택할 필요는 없습니다.</p><h3>1. 사용 프롬프트</h3><p>프롬프트 화면에서 저장하고 <b>AI 작업실에서 사용</b>이 켜진 프롬프트가 목록에 표시됩니다. 회차 설계, 집필, 원고 검토, 맞춤법 검사, DB 갱신 등 지금 하려는 작업에 맞는 프롬프트를 하나 선택합니다.</p><h3>2. 작품 기본 정보</h3><p><b>장르 + 핵심 콘셉트</b>는 작품의 기본 방향, <b>전체 줄거리</b>와 <b>타임라인</b>은 더 넓은 맥락이 필요할 때 선택합니다. 간단한 작업에 매번 전부 넣을 필요는 없습니다.</p><h3>3. 회차</h3><p><b>한 회차</b>는 지정한 한 화, <b>범위</b>는 시작~끝 회차, <b>최근 2화·최근 5화</b>는 현재까지의 최근 원고, <b>전체</b>는 저장된 모든 회차를 대상으로 합니다. 그 아래에서 회차 요약과 원고 본문 중 필요한 것을 선택합니다.</p><p><b>기승전결 블록</b>은 회차 설계 화면의 현재 임시 계획을 가져오며 회차 DB와 연결되지 않습니다. <b>참고 문체</b>도 회차 설계 화면에 저장된 문체 참고 자료를 가져옵니다.</p><h3>4. 작품 DB</h3><p>캐릭터·설정·떡밥은 <b>이번 작업에 관계된 항목만 선택</b>하는 것이 기본입니다. DB가 비어 있어도 프로그램 사용에는 문제가 없습니다. 실제 집필을 진행하면서 확정된 정보가 생길 때 하나씩 쌓아가면 됩니다.</p><p><b>선택 회차 관련 정보</b>는 선택한 회차에 연결해둔 캐릭터·설정·떡밥을 한꺼번에 골라줍니다. 선택 후 필요 없는 항목은 다시 빼도 됩니다.</p><h3>5. 스토리 계획</h3><p><b>블록</b>은 짧은 중기 흐름, <b>상세까지</b>는 해당 블록의 상세 스토리까지 함께 전달합니다. <b>전체 블록 / 전체 상세</b>는 한 번에 켜고 끄는 토글입니다. 스토리 계획은 실제로 벌어진 사실이 아니라 변경 가능한 미래 설계라는 전제로 조립됩니다.</p><h3>6. 생성과 복사</h3><p><b>GPT용 텍스트 생성</b>을 누르면 선택한 프롬프트와 자료가 오른쪽 조립 결과에 합쳐집니다. 예상 글자 수를 확인한 뒤 너무 많다면 이번 작업에 필요 없는 자료를 빼고, <b>전체 복사</b>로 복사해 사용합니다.</p><h3>기본 사용 예</h3><p>다음 회차 설계라면 관련 스토리 블록·상세 + 최근 회차 요약/원고 + 필요한 DB를 선택합니다. 집필이라면 현재 기승전결 + 직전/현재 원고 + 필요한 DB + 필요시 참고 문체를 선택합니다. 원고 검토나 DB 갱신은 완성된 실제 원고를 중심으로 필요한 자료만 추가합니다.</p>`);

<script id="mobile-writing-tools-js-v042">
(function(){
 let moved={};
 const mobile=()=>matchMedia('(max-width:700px)').matches;
 function move(kind){
   if(!mobile()) return;
   const panel=document.querySelector(kind==='snippets'?'#writingRoom>.toolsPanel':'#writingRoom>.planPanel');
   const target=document.getElementById(kind==='snippets'?'mobileSnippetsBody42':'mobileEpisodeDataBody42');
   if(!panel||!target)return;
   if(!moved[kind]) moved[kind]={panel:panel,parent:panel.parentNode,next:panel.nextSibling};
   target.appendChild(panel);
 }
 function restore(kind){
   const m=moved[kind]; if(!m)return;
   if(m.next&&m.next.parentNode===m.parent)m.parent.insertBefore(m.panel,m.next);
   else m.parent.appendChild(m.panel);
   delete moved[kind];
 }
 function open(kind){
   move(kind);
   const el=document.getElementById(kind==='snippets'?'mobileSnippetsDrawer42':'mobileEpisodeDataDrawer42');
   if(el)el.classList.add('open');
 }
 function close(id){
   const el=document.getElementById(id); if(el)el.classList.remove('open');
   restore(id==='mobileSnippetsDrawer42'?'snippets':'data');
 }
 document.addEventListener('click',e=>{
   if(e.target.closest('#mobileSnippets42')){e.preventDefault();open('snippets');return}
   if(e.target.closest('#mobileEpisodeData42')){e.preventDefault();open('data');return}
   const x=e.target.closest('[data-close42]'); if(x){close(x.dataset.close42);return}
   if(e.target.classList&&e.target.classList.contains('mobileToolBackdrop42'))close(e.target.id);
 });
 window.addEventListener('resize',()=>{
   if(!mobile()){
     ['mobileSnippetsDrawer42','mobileEpisodeDataDrawer42'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('open')});
     restore('snippets');restore('data');
   }
 });
})();
</script>
